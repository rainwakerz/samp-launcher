<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>SA-MP Launcher</title>
  <link rel="stylesheet" href="styles/style.css" />
</head>
<body>
  <div class="app">

    <!-- TITLEBAR -->
    <header class="titlebar">
      <div class="titlebar__brand">
        <div class="logo"></div>
        <span>SA-MP LAUNCHER</span>
      </div>
      <div class="titlebar__controls">
        <button id="btn-min" class="ctrl" title="Свернуть">─</button>
        <button id="btn-max" class="ctrl" title="Развернуть">☐</button>
        <button id="btn-close" class="ctrl ctrl--close" title="Закрыть">✕</button>
      </div>
    </header>

    <main class="content">

      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="sidebar__head">
          <h2 class="sidebar__title">Серверы</h2>
          <button class="btn-add" id="btn-addServer" title="Добавить сервер">+</button>
        </div>
        <ul class="server-list" id="serverList"></ul>

        <button class="sidebar__settings" id="btn-openSettings">
          <span class="sidebar__settings-icon">⚙</span>
          <span>НАСТРОЙКИ</span>
        </button>
      </aside>

      <!-- MAIN VIEW -->
      <section class="main-panel" id="viewMain">
        <div class="hero">
          <div class="hero__content">
            <h1 class="hero__title" id="heroTitle">—</h1>
            <p class="hero__subtitle" id="heroIp">—</p>
          </div>
        </div>

        <form class="form" id="launchForm">
          <div class="field">
            <label for="nickname">Никнейм</label>
            <input type="text" id="nickname" placeholder="Введите ваш ник" maxlength="20" />
          </div>

          <div class="form__actions">
            <label class="checkbox">
              <input type="checkbox" id="rememberMe" checked />
              <span>Запомнить меня</span>
            </label>
          </div>

          <button type="submit" class="btn btn--primary btn--launch" id="btn-launch">
            ▶ ИГРАТЬ
          </button>
        </form>
      </section>

      <!-- SETTINGS VIEW -->
      <section class="main-panel settings-view hidden" id="viewSettings">
        <div class="settings-header">
          <h2 class="settings-header__title">Настройки</h2>
        </div>

        <div class="settings-group">
          <h3 class="settings-group__title">Расположение San Andreas</h3>
          <div class="field">
            <label for="sampPath">Путь к GTA: San Andreas</label>
            <div class="field__row">
              <input type="text" id="sampPath" placeholder="C:\Games\GTA San Andreas" />
              <button type="button" class="btn btn--outline" id="btn-browse">ОБЗОР</button>
            </div>
          </div>
        </div>

        <div class="settings-footer">
          <button class="btn btn--primary" id="btn-saveSettings">СОХРАНИТЬ</button>
          <button class="btn btn--outline" id="btn-cancelSettings">ОТМЕНА</button>
        </div>
      </section>

    </main>

    <footer class="statusbar">
      <span id="statusText">Готово</span>
      <span class="statusbar__ver">v1.0.0</span>
    </footer>

    <div class="toast" id="toast"></div>

    <!-- МОДАЛКА: ДОБАВЛЕНИЕ СЕРВЕРА -->
    <div class="modal" id="modalAdd">
      <div class="modal__overlay" data-close></div>
      <div class="modal__window">
        <div class="modal__head">
          <h3 class="modal__title">Новый сервер</h3>
          <button class="modal__close" data-close>✕</button>
        </div>

        <div class="modal__body">
          <div class="field">
            <label for="newName">Название сервера</label>
            <input type="text" id="newName" placeholder="Например: Arizona RP" maxlength="32" />
          </div>

          <div class="field">
            <label for="newIp">IP:порт</label>
            <input type="text" id="newIp" placeholder="127.0.0.1:7777" />
          </div>
        </div>

        <div class="modal__foot">
          <button class="btn btn--outline" data-close>Отмена</button>
          <button class="btn btn--primary" id="btn-createServer">Добавить</button>
        </div>
      </div>
    </div>

    <!-- МОДАЛКА: ПОДТВЕРЖДЕНИЕ УДАЛЕНИЯ -->
    <div class="modal" id="modalDelete">
      <div class="modal__overlay" data-close></div>
      <div class="modal__window modal__window--sm">
        <div class="modal__head">
          <h3 class="modal__title">Удалить сервер?</h3>
          <button class="modal__close" data-close>✕</button>
        </div>
        <div class="modal__body">
          <p class="modal__text">
            Сервер <b id="deleteServerName">—</b> будет удалён из списка.
            Это действие нельзя отменить.
          </p>
        </div>
        <div class="modal__foot">
          <button class="btn btn--outline" data-close>Отмена</button>
          <button class="btn btn--danger" id="btn-confirmDelete">Удалить</button>
        </div>
      </div>
    </div>
  </div>

  <script src="scripts/renderer.js"></script>
</body>
</html>
